schema_version: "1.0"

pipeline:
  name: mobilenet-v2-int8
  version: p43b-v2-percentile-selective
  source_model: source-fp32.yaml

preprocessing:
  contract: mobilenet-v2-imagenet-v1
  media_type: image
  color_space: rgb
  width: 224
  height: 224
  layout: nchw
  dtype: float32
  resize: bilinear
  resize_shorter: 256
  crop: center
  normalize:
    scale: 0.0039215686
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

quantization:
  revision: v2
  method: static
  format: qdq
  activation_type: quint8
  weight_type: qint8
  per_channel: true
  calibration_method: percentile
  calibration_percentile: 99.999
  calibration_chunk_size: 50
  execution_provider: CPUExecutionProvider
  calibration_order: manifest
  op_types_to_quantize: [Clip, Conv, Gather, Gemm, Reshape, Unsqueeze]
  nodes_to_exclude: [Conv_88, Conv_94, Conv_95]
  op_types_to_exclude_output_quantization: []

calibration:
  pilot_samples: 200
  production_samples: 1000

evaluation:
  pilot_samples: 200
  production_samples: 5000

acceptance:
  max_top1_drop_percentage_points: 1.0
  max_top5_drop_percentage_points: 1.0
  min_model_size_reduction_ratio: 0.50
  min_top1_agreement_ratio: 0.95
  require_zero_inference_failures: true
  require_finite_outputs: true
