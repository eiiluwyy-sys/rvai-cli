[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvai-cli"
dynamic = ["version"]
description = "A unified CLI prototype for running AI workloads on RISC-V."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "RVAI contributors" },
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
onnx = [
  "numpy>=1.24,<3",
  "onnxruntime>=1.17,<2",
  "Pillow>=10,<13",
]
model-pipeline = [
  "numpy>=1.24,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.17,<2",
  "Pillow>=10,<13",
]
dev = [
  "build>=1,<2",
  "mypy>=1.11,<2",
  "onnx>=1.16,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
rvai = "rvai.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "rvai.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvai = ["data/*.txt", "data/models/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rvai"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/rvai", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
