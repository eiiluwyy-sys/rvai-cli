[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvai-cli"
version = "0.1.0"
description = "A unified CLI prototype for running AI workloads on RISC-V."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "RVAI contributors" },
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
onnx = [
  "numpy>=1.24,<3",
  "onnxruntime>=1.17,<2",
  "Pillow>=10,<13",
]
model-pipeline = [
  "numpy>=1.24,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.17,<2",
  "Pillow>=10,<13",
]
dev = [
  "onnx>=1.16,<2",
  "pytest>=8,<9",
]

[project.scripts]
rvai = "rvai.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvai = ["data/*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
